services:
  - type: web
    name: nawi-calibration-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: '[]'
      - key: REPORTS_DIR
        value: /tmp/nawi_reports
      - key: DATABASE_URL
        fromDatabase:
          name: nawi-db
          property: connectionString

databases:
  - name: nawi-db
    databaseName: nawi
    user: nawi_user
    plan: free
    region: oregon

